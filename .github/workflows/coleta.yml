name: Curadoria diária - 7h Pernambuco
on:
  schedule:
    - cron: '0,17,47 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coleta-diaria
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar se a coleta de hoje já foi concluída
        id: freshness
        env:
          COLLECTION_EVENT: ${{ github.event_name }}
        run: node scripts/collection-needed.mjs >> "$GITHUB_OUTPUT"
      - name: Buscar referências públicas
        if: steps.freshness.outputs.needed == 'true'
        run: node scripts/collect.mjs
      - name: Validar acervo
        if: steps.freshness.outputs.needed == 'true'
        run: node scripts/check.mjs
      - name: Publicar atualização
        if: steps.freshness.outputs.needed == 'true'
        run: |
          git config user.name "Observatório Econômico"
          git config user.email "actions@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "Atualiza curadoria diária"
          git push
